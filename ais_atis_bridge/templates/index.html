<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIS-ATIS Bridge</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">AIS-catcher companion</p><h1>AIS-ATIS Bridge</h1></div><span id="state" class="badge">LOADING</span></header>
<section class="grid"><article><h2>Latest Marine ATIS</h2><div id="identity" class="identity">No validated ATIS received</div><dl id="details"></dl></article>
<article><h2>Second RTL-SDR</h2><form id="settings"><label>Receiver<select id="receiver" required><option value="">Select receiver</option></select></label><div class="row"><label>Mode<select id="tuning_mode"><option value="scan">Scan channels</option><option value="fixed">Fixed channel</option></select></label><label>Fixed channel<select id="selected_channel"></select></label></div><div class="row"><label>Gain<select id="gain_mode"><option value="auto">Automatic</option><option value="manual">Manual</option></select></label><label>Gain dB<input id="gain_db" type="number" min="0" max="49.6" step="0.1"></label></div><h3>Scan channels</h3><div id="channels" class="channels"></div><button type="submit">Save and start</button><button class="secondary" id="stop" type="button">Stop receiver</button><div class="row"><a class="button secondary" href="/api/channels/export.xlsx">Export Excel</a><label class="button secondary">Import Excel<input id="xlsx" type="file" accept=".xlsx" hidden></label></div><p id="message"></p></form></article></section>
<footer>Read-only AIS correlation · Never use for navigation or safety</footer></main><script src="/static/app.js"></script></body></html>
