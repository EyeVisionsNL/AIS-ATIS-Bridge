[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-atis-bridge"
version = "0.1.7"
description = "Marine ATIS decoder and AIS-catcher companion for a second RTL-SDR"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "numpy>=1.24,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ais-atis-bridge = "ais_atis_bridge.app:main"

[tool.setuptools.packages.find]
include = ["ais_atis_bridge", "ais_atis_bridge.*"]
namespaces = false

[tool.setuptools.package-data]
ais_atis_bridge = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
